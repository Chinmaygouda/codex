[project]
name = "codecourt"
version = "0.1.0"
description = "Grounded debate-driven evaluation for AI code agents"
requires-python = ">=3.12"
dependencies = [
  "openai>=2.38.0",
  "python-dotenv>=1.0.0",
  "google-genai>=1.0.0",
  "bandit>=1.9.4",
  "fastapi>=0.124.4",
  "uvicorn>=0.33.0",
  "jinja2>=3.1.0",
]

[tool.unittest]
start-directory = "tests"

[tool.setuptools.packages.find]
include = ["codecourt*"]
